<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnlyTab 管理</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body { background: linear-gradient(135deg,#eaf2fc 0%,#dbe9fb 100%); display: block; align-items: unset; color: #1f2d3d; min-height: 100vh; }
    .admin { max-width: 920px; margin: 0 auto; padding: 28px 18px 80px; }
    .admin h1 { font-size: 22px; font-weight: 700; margin-bottom: 4px; color: #0f2440; }
    .admin .sub { color: #5b6b82; font-size: 13px; margin-bottom: 22px; }
    .card { background: #ffffff; border: 1px solid #dbe7f5; border-radius: 14px; padding: 18px 20px; margin-bottom: 18px; box-shadow: 0 2px 12px rgba(31,77,140,0.06); }
    .card h2 { font-size: 15px; margin-bottom: 14px; color: #243b5e; display: flex; align-items: center; gap: 8px; }
    .card h2 .dot { width: 7px; height: 7px; border-radius: 50%; background: #3b82f6; }
    label { display: block; font-size: 12px; color: #5b6b82; margin: 10px 0 4px; }
    input[type=text], input[type=password], input[type=url], input[type=number], select, textarea {
      width: 100%; background: #f7fbff; border: 1px solid #cdd9e8; color: #1f2d3d;
      border-radius: 8px; padding: 9px 10px; font-size: 14px; outline: none;
    }
    input:focus, select:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.15); }
    .row { display: flex; gap: 10px; flex-wrap: wrap; }
    .row > div { flex: 1 1 200px; }
    .btn { background: #3b82f6; color: #fff; border: none; border-radius: 8px; padding: 9px 16px; font-size: 14px; font-weight: 600; cursor: pointer; }
    .btn:hover { background: #2563eb; }
    .btn.ghost { background: #fff; color: #334e68; border: 1px solid #bccde0; }
    .btn.ghost:hover { border-color: #3b82f6; color: #1f2d3d; }
    .btn.danger { background: #fee2e2; color: #b91c1c; }
    .btn.danger:hover { background: #fecaca; }
    .btn.sm { padding: 5px 10px; font-size: 12px; }
    .item { background: #f4f9ff; border: 1px solid #dbe7f5; border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
    .item .top { display: flex; gap: 8px; align-items: flex-end; }
    .item .iconsm { width: 36px; height: 36px; border-radius: 8px; object-fit: cover; background: #e3edfb; flex: 0 0 36px; display: flex; align-items: center; justify-content: center; font-size: 16px; overflow: hidden; }
    .item .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .item .filebtn { font-size: 12px; color: #2563eb; cursor: pointer; }
    .savebar { position: sticky; bottom: 0; background: rgba(234,242,252,0.92); border-top: 1px solid #cdd9e8; padding: 14px 0; margin-top: 10px; backdrop-filter: blur(6px); }
    .savebar .inner { max-width: 920px; margin: 0 auto; padding: 0 18px; display: flex; gap: 10px; justify-content: flex-end; }
    .status { font-size: 13px; color: #16a34a; margin-right: auto; }
    .backlink { color: #2563eb; font-size: 13px; text-decoration: none; }
    /* 登录遮罩 */
    .mask { position: fixed; inset: 0; background: rgba(234,242,252,0.94); display: flex; align-items: center; justify-content: center; z-index: 100; }
    .mask .box { background: #fff; border: 1px solid #dbe7f5; border-radius: 14px; padding: 26px; width: 320px; box-shadow: 0 10px 40px rgba(31,77,140,0.18); }
    .mask h3 { margin-bottom: 14px; color: #0f2440; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <!-- 登录遮罩 -->
  <div class="mask" id="loginMask">
    <div class="box">
      <h3>管理登录</h3>
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="admin" autocomplete="off" />
      <label style="margin-top:10px;">密码</label>
      <input type="password" id="loginPass" placeholder="请输入密码" autocomplete="off" />
      <div style="margin-top:14px; text-align:right;">
        <button class="btn" id="loginBtn">进入</button>
      </div>
      <div id="loginErr" style="color:#dc2626; font-size:12px; margin-top:8px;"></div>
    </div>
  </div>

  <div class="admin">
    <h1>OnlyTab 管理后台</h1>
    <div class="sub">所有修改点击「保存」后即时生效（写入 data/config.json）。<a class="backlink" href="/">← 返回首页</a></div>

    <!-- 站点信息 -->
    <div class="card">
      <h2><span class="dot"></span>站点与底部信息</h2>
      <label>站点标题（浏览器标签名）</label>
      <input type="text" id="siteTitle" />
      <label>默认背景（留空使用默认渐变；可填图片 URL 或上传本地图片）</label>
      <div class="row">
        <div><input type="text" id="siteBg" placeholder="https://... 或 /uploads/xxx" /></div>
        <div style="flex:0 0 auto;"><span class="filebtn" id="siteBgUp">上传背景图</span><input type="file" id="siteBgFile" accept="image/*" class="hidden" /></div>
      </div>
      <label>版权信息</label>
      <input type="text" id="siteCopyright" placeholder="© 2026 OnlyTab" />
      <div class="row">
        <div>
          <label>ICP 备案号（底部展示，自动链接到 beian.miit.gov.cn）</label>
          <input type="text" id="siteIcp" placeholder="京ICP备XXXXXXXX号" />
        </div>
        <div>
          <label>网安备案号（底部展示，自动链接到 beian.gov.cn）</label>
          <input type="text" id="sitePolice" placeholder="京公网安备 XXXXXXXXXXXXXX号" />
        </div>
      </div>
    </div>

    <!-- 登录账号 -->
    <div class="card">
      <h2><span class="dot"></span>登录账号</h2>
      <label>用户名（默认 admin，可修改）</label>
      <input type="text" id="accUser" placeholder="admin" />
      <label style="margin-top:10px;">新密码（留空则仅修改用户名；填写则至少 6 位）</label>
      <input type="password" id="accPass" placeholder="不修改请留空" />
      <div style="margin-top:12px;">
        <button class="btn" id="accBtn">修改账号 / 密码</button>
      </div>
      <div id="accStatus" style="font-size:12px; margin-top:8px;"></div>
    </div>

    <!-- 搜索 -->
    <div class="card">
      <h2><span class="dot"></span>搜索引擎</h2>
      <label>默认搜索引擎</label>
      <select id="searchDefault"></select>
      <label>引擎列表（搜索链接中使用 <code>{q}</code> 作为关键词占位符）</label>
      <div id="engines"></div>
      <button class="btn ghost sm" id="addEngine" style="margin-top:10px;">+ 添加引擎</button>
    </div>

    <!-- 天气 -->
    <div class="card">
      <h2><span class="dot"></span>天气组件</h2>
      <label>定位方式</label>
      <select id="weatherMode">
        <option value="auto">自动（按访问者 IP 定位，国内源）</option>
        <option value="custom">指定城市</option>
      </select>
      <label>城市（选择“指定城市”时填写，如：杭州、上海）</label>
      <input type="text" id="weatherCity" />
      <label>天气数据源</label>
      <select id="weatherProvider">
        <option value="openmeteo">Open-Meteo（国际源，免密钥，国内可用）</option>
        <option value="qweather">和风天气（国内源，需下方 Key）</option>
      </select>
      <label>和风天气 Key（仅在使用“和风天气”时填写；服务端使用，不会暴露给浏览器）</label>
      <input type="text" id="weatherKey" placeholder="和风天气 Dev Key" />
    </div>

    <!-- 样式设置 -->
    <div class="card">
      <h2><span class="dot"></span>样式设置</h2>
      <div class="row">
        <div>
          <label>每行标签个数（横排）</label>
          <input type="number" id="styleColumns" min="1" max="16" step="1" />
        </div>
        <div>
          <label>图标大小 (px)</label>
          <input type="number" id="styleIconSize" min="24" max="128" step="2" />
        </div>
      </div>
      <div class="row">
        <div>
          <label>字体粗细</label>
          <select id="styleWeight">
            <option value="300">细 (300)</option>
            <option value="400">常规 (400)</option>
            <option value="500">中等 (500)</option>
            <option value="600">加粗 (600)</option>
            <option value="700">特粗 (700)</option>
          </select>
        </div>
        <div>
          <label>显示读秒</label>
          <select id="styleSeconds">
            <option value="1">显示（时:分:秒）</option>
            <option value="0">不显示（时:分）</option>
          </select>
        </div>
      </div>
    </div>

    <!-- 标签 -->
    <div class="card">
      <h2><span class="dot"></span>导航标签（每行个数见「样式设置」）</h2>
      <div id="tabs"></div>
      <button class="btn ghost sm" id="addTab" style="margin-top:6px;">+ 添加标签</button>
    </div>

    <div class="savebar">
      <div class="inner">
        <span class="status" id="status"></span>
        <button class="btn ghost" id="resetBtn">恢复默认</button>
        <button class="btn" id="saveBtn">保存</button>
      </div>
    </div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
