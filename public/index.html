<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnlyTab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶部：时钟 + 搜索 -->
  <div class="top">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date">加载中…</div>
    <form class="search glass" id="searchForm">
      <select id="engineSelect" aria-label="搜索引擎"></select>
      <span class="divider"></span>
      <input id="searchInput" type="text" placeholder="输入关键词搜索…" autocomplete="off" />
      <button type="submit" title="搜索">🔍</button>
    </form>
  </div>

  <!-- 中部：天气 + 日历 -->
  <div class="panels">
    <div class="panel glass" id="weatherPanel">
      <div class="weather-head">
        <span class="weather-city" id="weatherCity">天气</span>
        <span class="hint" id="weatherStatus"></span>
      </div>
      <div class="weather-temp" id="weatherTemp">--°</div>
      <div class="weather-desc" id="weatherDesc"></div>
      <div class="weather-hl" id="weatherHL"></div>
      <div class="forecast" id="forecast"></div>
    </div>

    <div class="panel glass" id="calendarPanel">
      <div class="calendar-head">
        <span class="calendar-title" id="calTitle"></span>
        <span class="hint" id="calLunar"></span>
      </div>
      <div class="calendar-big" id="calBig"></div>
      <div class="calendar-sub" id="calSub"></div>
      <div class="calendar-grid" id="calGrid"></div>
    </div>
  </div>

  <!-- 标签网格 -->
  <div class="tabs-wrap" id="tabs"></div>

  <!-- 底部 -->
  <div class="footer" id="footer"></div>

  <script src="lunar.js"></script>
  <script src="home.js"></script>
</body>
</html>
