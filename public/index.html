<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OnlyTab</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🚀</text></svg>" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶部：时钟 + 搜索 -->
  <div class="top">
    <div class="clock" id="clock">--:--:--</div>
    <div class="date" id="date">加载中…</div>
    <form class="search glass" id="searchForm">
      <select id="engineSelect" aria-label="搜索引擎"></select>
      <span class="divider"></span>
      <input id="searchInput" type="text" placeholder="输入关键词搜索…" autocomplete="off" />
      <button type="submit" title="搜索">🔍</button>
    </form>
  </div>

  <!-- 混排面板：天气/日历小组件 + 标签，可在首页直接拖动排序 -->
  <div class="board" id="board"></div>

  <!-- 底部 -->
  <div class="footer" id="footer"></div>

  <!-- 排序提示 -->
  <div class="toast" id="toast"></div>

  <script src="lunar.js"></script>
  <script src="home.js"></script>
</body>
</html>
